<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>支持 - RentFlow 租住管家</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: #f9fafb;
      line-height: 1.7;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      background: #fff;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding-bottom: 32px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 40px;
    }
    .logo {
      display: inline-block;
      width: 56px;
      height: 56px;
      background: #2e8f7b;
      color: #fff;
      border-radius: 14px;
      margin-bottom: 16px;
      line-height: 56px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }
    .meta {
      font-size: 13px;
      color: #6b7280;
    }
    h2 {
      font-size: 17px;
      font-weight: 600;
      color: #111827;
      margin: 32px 0 12px;
    }
    p, li {
      font-size: 15px;
      color: #374151;
      margin-bottom: 10px;
    }
    ul {
      padding-left: 20px;
      margin-bottom: 12px;
    }
    .box {
      background: #edf7f5;
      border-left: 3px solid #2e8f7b;
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 20px 0;
    }
    a { color: #2e8f7b; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">R</div>
    <h1>RentFlow 租住管家</h1>
    <p class="meta">支持与帮助</p>
  </header>

  <div class="box">
    <p>如您在使用 RentFlow 时遇到问题，可以通过邮件联系我们。我们会尽快处理账号、数据、功能使用和反馈建议。</p>
  </div>

  <h2>联系我们</h2>
  <p>邮箱：<a href="mailto:support@rentflow.app">support@rentflow.app</a></p>

  <h2>常见支持范围</h2>
  <ul>
    <li>账号登录、密码修改、账号注销</li>
    <li>房源、租客、租约、账单、抄表和报修功能使用</li>
    <li>提醒、数据导出、权限授权相关问题</li>
    <li>产品建议和问题反馈</li>
  </ul>

  <h2>隐私政策</h2>
  <p>您可以查看 <a href="./privacy-policy.html">RentFlow 隐私政策</a> 了解数据收集、使用和删除方式。</p>

  <footer>
    © 2026 RentFlow &nbsp;·&nbsp; 保留所有权利
  </footer>
</div>
